plugins {
    id 'com.android.application'

    id 'com.google.gms.google-services'

}
android {
    compileSdkVersion 33
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.alifew.alifeworld"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.01"


        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            applicationVariants.all { variant ->
                variant.outputs.all {
                    outputFileName = "Alife World.apk"
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }

    lintOptions {
        checkReleaseBuilds false
    }

    viewBinding{
        enabled = true
    }
}

configurations.all {
    exclude group: 'com.google.android.gms', module: 'play-services-safetynet'
}

dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    //noinspection GradleCompatible
    implementation 'com.android.support:support-v4:28.0.0'
    implementation 'com.google.firebase:firebase-messaging-ktx:23.2.1'
//    implementation 'com.google.firebase:firebase-messaging-ktx:23.2.1'


    //MVVM dependencies
    def lifecycle_version = "2.3.1"
    def arch_version = "2.1.0"
    // ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    // LiveData
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    // Annotation processor
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:$lifecycle_version"
    //implementation "android.arch.lifecycle:extensions:$lifecycle_version"

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
    implementation 'net.gotev:uploadservice:3.1'
    //cardview
    implementation "androidx.cardview:cardview:1.0.0"
    //alertDialogLoader
    implementation 'cc.cloudist.acplibrary:library:1.2.1'
    //circleImageView
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.mikhaellopez:circularimageview:4.2.0'
    implementation 'com.squareup.retrofit2:retrofit:2.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.5.0'
    implementation 'com.squareup.picasso:picasso:2.8'
    //recyclerview
    implementation "androidx.recyclerview:recyclerview:1.2.1"


    //glide
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
    implementation 'com.github.captain-miao:optroundcardview:1.0.0'

    //justify textview
    implementation 'me.biubiubiu.justifytext:library:1.1'
    implementation "androidx.work:work-runtime:2.7.1"
    //implementation 'androidx.work:work-runtime-ktx:2.3.1'
//    implementation files('../app/libs/unity-ads.aar')
   // implementation 'com.startapp:inapp-sdk:4.8.7'

    implementation 'com.google.android.gms:play-services-ads:20.3.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'

    implementation 'com.github.Gkemon:XML-to-PDF-generator:2.5'
    // the latest version is "v1.0.1"


    //room database
    def room_version = "2.2.5"

    //noinspection GradleDependency
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"


    //barcode
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    //coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

    //onesignal
    implementation 'com.onesignal:OneSignal:[4.0.0, 4.99.99]'

    //sliderview
    implementation 'com.github.smarteist:autoimageslider:1.4.0-appcompat'

    implementation 'io.github.shashank02051997:FancyToast:2.0.2'

    implementation 'com.itextpdf:itextg:5.5.10'
    implementation 'com.karumi:dexter:6.2.3'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'


    implementation 'com.google.android.gms:play-services-location:18.0.0'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:review:2.0.1'

    implementation 'com.intuit.sdp:sdp-android:1.1.0'

    //firebase
//    implementation(platform("com.google.firebase:firebase-bom:32.2.3"))
//    implementation 'com.google.firebase:firebase-messaging:23.2.1'
//    implementation("com.google.firebase:firebase-analytics")


    implementation 'com.makeramen:roundedimageview:2.3.0'

}